<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <!-- Cyan Void Glow -->
    <radialGradient id="equipSpaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#072242" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#020612" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Mylar Foil / Kapton Insulating Blanket -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe28a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Aluminum / Titanium Structural Metal -->
    <linearGradient id="titaniumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Cyan Laser Ping Beam -->
    <linearGradient id="laserBeam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Deep space aura -->
  <rect width="400" height="220" fill="transparent"/>
  <circle cx="200" cy="110" r="100" fill="url(#equipSpaceGlow)"/>

  <!-- Radar / Telemetry Reticle Rings -->
  <circle cx="200" cy="110" r="70" fill="none" stroke="#00f0ff" stroke-width="0.75" stroke-dasharray="3 5" opacity="0.4"/>
  <circle cx="200" cy="110" r="45" fill="none" stroke="#0077fe" stroke-width="0.5" opacity="0.3"/>
  <line x1="120" y1="110" x2="280" y2="110" stroke="#00f0ff" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.25"/>
  <line x1="200" y1="30" x2="200" y2="190" stroke="#00f0ff" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.25"/>

  <!-- Laser Ranging Beam (pulsing upwards towards Earth) -->
  <polygon points="198,110 202,110 240,20 236,20" fill="url(#laserBeam)"/>

  <!-- Central Lunar Module Descent Stage (Octagonal core with gold foil) -->
  <g transform="translate(200, 115)">
    <!-- Main Octagon Body -->
    <polygon points="-42,-22 42,-22 54,0 42,22 -42,22 -54,0" fill="url(#goldFoil)" stroke="#fef08a" stroke-width="1.2"/>

    <!-- Equipment Bays / Compartment Seams -->
    <line x1="-20" y1="-22" x2="-20" y2="22" stroke="#78350f" stroke-width="1"/>
    <line x1="20" y1="-22" x2="20" y2="22" stroke="#78350f" stroke-width="1"/>
    <line x1="-42" y1="0" x2="42" y2="0" stroke="#78350f" stroke-width="0.8"/>

    <!-- Central Descent Engine Nozzle (Bell) -->
    <polygon points="-12,22 12,22 16,36 -16,36" fill="#1e293b" stroke="#475569" stroke-width="1"/>

    <!-- Four Landing Gear Struts & Footpads -->
    <!-- Left Strut -->
    <line x1="-42" y1="15" x2="-80" y2="48" stroke="url(#titaniumGrad)" stroke-width="3"/>
    <line x1="-30" y1="5" x2="-80" y2="48" stroke="url(#titaniumGrad)" stroke-width="1.8"/>
    <ellipse cx="-80" cy="50" rx="14" ry="4" fill="#64748b" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="-80" y1="48" x2="-80" y2="62" stroke="#94a3b8" stroke-width="1"/> <!-- Lunar surface probe -->

    <!-- Right Strut -->
    <line x1="42" y1="15" x2="80" y2="48" stroke="url(#titaniumGrad)" stroke-width="3"/>
    <line x1="30" y1="5" x2="80" y2="48" stroke="url(#titaniumGrad)" stroke-width="1.8"/>
    <ellipse cx="80" cy="50" rx="14" ry="4" fill="#64748b" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="80" y1="48" x2="80" y2="62" stroke="#94a3b8" stroke-width="1"/>

    <!-- Egress Ladder (on forward leg) -->
    <line x1="-22" y1="-18" x2="-38" y2="38" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="-25" y1="-10" x2="-28" y2="-10" stroke="#ffffff" stroke-width="1"/>
    <line x1="-28" y1="0" x2="-31" y2="0" stroke="#ffffff" stroke-width="1"/>
    <line x1="-31" y1="10" x2="-34" y2="10" stroke="#ffffff" stroke-width="1"/>
    <line x1="-34" y1="20" x2="-37" y2="20" stroke="#ffffff" stroke-width="1"/>

    <!-- Lunar Laser Retroreflector Pallet (LRRR) -->
    <rect x="22" y="-12" width="18" height="12" fill="#0369a1" stroke="#00f0ff" stroke-width="1"/>
    <!-- Array of corner cubes -->
    <circle cx="26" cy="-6" r="1.5" fill="#ffffff"/>
    <circle cx="31" cy="-6" r="1.5" fill="#ffffff"/>
    <circle cx="36" cy="-6" r="1.5" fill="#ffffff"/>

    <!-- Commemorative Plaque on Ladder Strut -->
    <rect x="-31" y="8" width="6" height="5" fill="#e2e8f0" stroke="#0f172a" stroke-width="0.5"/>
  </g>

  <!-- Technical Telemetry Annotations -->
  <g transform="translate(45, 60)">
    <text x="0" y="0" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" letter-spacing="0.5">LM DESCENT STAGE</text>
    <text x="0" y="10" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="6.5">MASS: 2,150 KG DRY</text>
    <line x1="85" y1="-3" x2="145" y2="35" stroke="#00f0ff" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.6"/>
  </g>

  <g transform="translate(255, 60)">
    <text x="0" y="0" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" letter-spacing="0.5">LASER RETROREFLECTOR</text>
    <text x="0" y="10" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="6.5">ACTIVE: 1969 - PRESENT</text>
    <line x1="-5" y1="2" x2="-25" y2="45" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.6"/>
  </g>

  <!-- Ground Plane Horizon Line -->
  <line x1="50" y1="172" x2="350" y2="172" stroke="#334155" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.5"/>
  <text x="200" y="195" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="7" letter-spacing="1">SURFACE REGOLITH PRESERVE</text>
</svg>

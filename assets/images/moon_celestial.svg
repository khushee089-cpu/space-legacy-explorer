<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <!-- Background Space Gradient -->
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1936" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020612" stop-opacity="0"/>
    </radialGradient>

    <!-- Moon Body Gradient -->
    <radialGradient id="moonShading" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="45%" stop-color="#cbd5e1"/>
      <stop offset="80%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>

    <!-- Lunar Mare (Dark Basalt Plains) -->
    <radialGradient id="mareGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.4"/>
    </radialGradient>

    <!-- Cyan Horizon Glow -->
    <filter id="cyanGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep space background aura -->
  <rect width="400" height="220" fill="transparent"/>
  <circle cx="200" cy="110" r="100" fill="url(#spaceGlow)"/>

  <!-- Orbital trajectory arc -->
  <path d="M 50 180 Q 200 20 350 120" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.6"/>
  
  <!-- Outer Atmospheric / Solar Reflection Halo -->
  <circle cx="200" cy="110" r="75" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.3" filter="url(#cyanGlowFilter)"/>

  <!-- The Moon Sphere -->
  <circle cx="200" cy="110" r="68" fill="url(#moonShading)"/>

  <!-- Major Lunar Maria (Sea of Tranquility, Ocean of Storms, Mare Serenitatis) -->
  <ellipse cx="215" cy="100" rx="20" ry="14" fill="url(#mareGrad)" transform="rotate(-10 215 100)"/>
  <ellipse cx="180" cy="95" rx="16" ry="22" fill="url(#mareGrad)" transform="rotate(15 180 95)"/>
  <ellipse cx="195" cy="130" rx="24" ry="12" fill="url(#mareGrad)"/>
  <ellipse cx="230" cy="120" rx="14" ry="18" fill="url(#mareGrad)"/>

  <!-- Famous Impact Craters -->
  <!-- Tycho & Ray system -->
  <circle cx="205" cy="155" r="4" fill="#f1f5f9"/>
  <circle cx="205" cy="155" r="4" stroke="#94a3b8" stroke-width="0.8" fill="none"/>
  <line x1="205" y1="155" x2="175" y2="135" stroke="#f8fafc" stroke-width="0.75" opacity="0.5"/>
  <line x1="205" y1="155" x2="235" y2="130" stroke="#f8fafc" stroke-width="0.75" opacity="0.5"/>
  <line x1="205" y1="155" x2="210" y2="175" stroke="#f8fafc" stroke-width="0.75" opacity="0.5"/>

  <!-- Copernicus Crater -->
  <circle cx="178" cy="115" r="5" fill="#e2e8f0"/>
  <circle cx="178" cy="115" r="5" stroke="#64748b" stroke-width="0.8" fill="none"/>

  <!-- Apollo 11 Tranquility Base Landing Marker -->
  <g transform="translate(222, 105)">
    <circle cx="0" cy="0" r="4" fill="#00f0ff" opacity="0.9">
      <animate attributeName="r" values="3;6;3" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
    <line x1="3" y1="-3" x2="16" y2="-16" stroke="#00f0ff" stroke-width="1"/>
    <text x="20" y="-14" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" letter-spacing="0.5">APOLLO 11 (0.67°N)</text>
  </g>

  <!-- Stars in background -->
  <circle cx="65" cy="45" r="1" fill="#ffffff" opacity="0.8"/>
  <circle cx="340" cy="35" r="1.2" fill="#00f0ff" opacity="0.9"/>
  <circle cx="310" cy="180" r="0.8" fill="#ffffff" opacity="0.6"/>
  <circle cx="85" cy="165" r="1" fill="#38bdf8" opacity="0.7"/>
</svg>
